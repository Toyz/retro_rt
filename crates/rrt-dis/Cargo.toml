[package]
name = "rrt-dis"
version = "0.1.0"
description = "Disassembly for reverse engineering: instructions decoded into structure and lifted into a small IR behind an Arch trait (the PS1's R3000A and the PS2's R5900, with a conformance kit for new backends), a symbol table that is a project file, executable formats, whole-program analysis, listings, a pseudo-code decompiler, and the rrt-dis command (feature cli)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The rrt-dis command. The library itself has no dependencies.
cli = ["dep:rrt-kit", "dep:rrt-macros"]

[dependencies]
rrt-kit = { workspace = true, optional = true }
rrt-macros = { workspace = true, optional = true }

[[bin]]
name = "rrt-dis"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[lints]
workspace = true
