[package]
name = "rrt-kit"
version = "0.1.0"
description = "The small things every port rewrites: buffers recycled across frames (Staging, Pool), a generational arena (Slab), a fixed-capacity history (Ring), reproducible randomness (the era's generators and reductions behind one trait), fixed-point numbers (Q12), a byte reader for file formats, the era's colour formats (PS1/PS2, N64, GameCube, Dreamcast, PSP, Sega, SNES/GBA) with YCbCr and palettes, and BCD. No dependencies."
