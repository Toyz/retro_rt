spec_version = 1

[project]
name        = "retro_rt"
slug        = "retro-rt"
description = "The shared runtime for Rust ports of retro games: the engine loop, the pad, wgpu, audio, disc images and networking that hwtr, piney_apples and the ports after them build on. Nothing console- or game-specific."

[site]
readme = "README.md"

[docs]
dir   = "docs"
label = "Reference"

[[link]]
label = "GitHub"
icon = "github"
url  = "https://github.com/Toyz/retro_rt"

[[link]]
label = "GitHub Issues"
icon = "github"
url  = "https://github.com/Toyz/retro_rt/issues"

[index]
header = """
# Worklog

Running engineering log for retro_rt, the shared runtime under the retro game
ports. One file per entry under [`worklog/`](worklog/), newest at the bottom.
This index is generated by `cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
The [reference](docs/README.md) says what is true now.
"""

[[area]]
name  = "app"
about = "the engine loop, Game, Config, the clock, #[rrt::main], headless runs"
[[area]]
name  = "input"
about = "the host pad: gamepads, keyboard, rumble, the pad convention"
[[area]]
name  = "gpu"
about = "wgpu plumbing: devices, targets, readback, the presenter, colour"
[[area]]
name  = "audio"
about = "sound out: sources, the device, resampling"
[[area]]
name  = "disc"
about = "disc images, CUE sheets, raw sectors, ISO 9660"
[[area]]
name  = "net"
about = "UDP, TCP, framing, the reliable UDP protocol"
[[area]]
name  = "docs"
about = "the reference pages, the docs skill, rrt-docs"
[[area]]
name  = "port"
about = "moving a game onto the runtime, or what a game needed from it"
[[area]]
name  = "design"
about = "a decision made, with the alternatives rejected"
[[area]]
name  = "bug"
about = "a fault diagnosed, with the root cause"
[[area]]
name  = "perf"
about = "a measurement taken"
[[area]]
name  = "build"
about = "workspace layout, dependencies, CI, how things are run"
[[area]]
name  = "test"
about = "harnesses and fixtures"

[[publish]]
name = "site"
type = "dir"
path = "site/"
